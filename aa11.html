    var map = new kakao.maps.Map(document.getElementById('map'), { center: new kakao.maps.LatLng(33.38, 126.55), level: 10 });
    var clusterer = new kakao.maps.MarkerClusterer({ map: map, averageCenter: true, minLevel: 9 });
    var markersData = [], currentInfoWindow = null;
    var roadviewClient = new kakao.maps.RoadviewClient();
    var roadview = null, roadviewTarget = null;

    function distanceMeters(a, b) {
        const toRad = value => value * Math.PI / 180;
        const dLat = toRad(b.getLat() - a.getLat());
        const dLng = toRad(b.getLng() - a.getLng());
        const lat1 = toRad(a.getLat()), lat2 = toRad(b.getLat());
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
        return 6371000 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
    }

    function updateRoadviewStatus() {
        if (!roadview || !roadviewTarget) return;
        const panoPosition = roadview.getPosition();
        if (!panoPosition) return;
        const distance = Math.round(distanceMeters(roadviewTarget, panoPosition));
        document.getElementById('roadviewStatus').textContent = distance <= 20
            ? '시설과 가장 가까운 촬영 지점입니다.'
            : `시설에서 약 ${distance.toLocaleString()}m 떨어진 가장 가까운 촬영 지점입니다.`;
    }

    function openNearestRoadview(lat, lng, name) {
        const modal = document.getElementById('roadviewModal');
        const status = document.getElementById('roadviewStatus');
        roadviewTarget = new kakao.maps.LatLng(Number(lat), Number(lng));
        document.getElementById('roadviewTitle').textContent = `${name} 주변 로드뷰`;
        status.textContent = '주변 촬영 지점을 찾고 있습니다.';
        modal.classList.add('open');

        if (!roadview) {
            roadview = new kakao.maps.Roadview(document.getElementById('roadviewContainer'));
            kakao.maps.event.addListener(roadview, 'init', updateRoadviewStatus);
            kakao.maps.event.addListener(roadview, 'position_changed', updateRoadviewStatus);
        }
        roadview.relayout();

        const radii = [50, 200, 500, 1000, 3000, 5000];
        const findPano = index => {
            if (index >= radii.length) {
                status.textContent = '반경 5km 안에서 이용 가능한 로드뷰를 찾지 못했습니다.';
                return;
            }
            roadviewClient.getNearestPanoId(roadviewTarget, radii[index], panoId => {
                if (panoId === null) {
                    findPano(index + 1);
                    return;
                }
                status.textContent = '가장 가까운 촬영 지점을 불러오는 중입니다.';
                roadview.setPanoId(panoId, roadviewTarget);
                setTimeout(updateRoadviewStatus, 500);
            });
        };
        findPano(0);
    }

    function openNearestRoadviewByNo(no) {
        const row = mapData.find(item => String(item.NO) === String(no));
        if (!row || !row.lat || !row.lng) {
            alert('이 시설은 위치 정보가 없어 로드뷰를 열 수 없습니다.');
            return;
        }
        openNearestRoadview(row.lat, row.lng, row['대상명'] || '선택 시설');
    }

    function closeRoadview(event) {
        if (event && event.target !== event.currentTarget) return;
        document.getElementById('roadviewModal').classList.remove('open');

        infoWindow.open(map, marker);
        currentInfoWindow = infoWindow;
    }

    function toggleSidebar() {
        const isClosed = document.body.classList.toggle('sidebar-closed');
        const button = document.getElementById('sidebarToggle');
        button.textContent = isClosed ? '›' : '‹';
        button.setAttribute('aria-expanded', String(!isClosed));
        button.setAttribute('aria-label', isClosed ? '사이드 창 열기' : '사이드 창 닫기');
        setTimeout(() => map.relayout(), 260);
    }

    let pendingPrivateNo = null;

    function showPrivateInfo(no) {
        pendingPrivateNo = no;
        const modal = document.getElementById('privateModal');
        const input = document.getElementById('privatePassword');
        document.getElementById('passwordError').textContent = '';
        input.value = '';
        modal.classList.add('open');
        setTimeout(() => input.focus(), 50);
    }

    function closePrivateModal(event) {
        if (event && event.target !== event.currentTarget) return;
        document.getElementById('privateModal').classList.remove('open');
        pendingPrivateNo = null;
    }

    function confirmPrivateInfo() {
        const input = document.getElementById('privatePassword');
        if (input.value !== '0119') {
            document.getElementById('passwordError').textContent = '비밀번호가 올바르지 않습니다.';
            input.select();
            return;
        }
        const no = pendingPrivateNo;
        const row = mapData.find(item => String(item.NO) === String(no));
        const box = document.getElementById('private-info-' + no);
        const button = document.getElementById('private-btn-' + no);
        if (row && box) {
            box.replaceChildren();
            const manager = document.createElement('div');
            const managerLabel = document.createElement('b');
            managerLabel.textContent = '👤 관리자  ';
            manager.append(managerLabel, document.createTextNode(row['위험물안전관리자'] || '정보없음'));
            const phone = document.createElement('div');
            const phoneLabel = document.createElement('b');
            phoneLabel.textContent = '📞 연락처  ';
            phone.append(phoneLabel, document.createTextNode(row['전화번호'] || row['연락처'] || '없음'));
            box.append(manager, phone);
            box.style.display = 'block';
            if (button) button.style.display = 'none';
        }
        document.getElementById('privateModal').classList.remove('open');
        pendingPrivateNo = null;
    }

    function getMarkerImg(jur, baesu) {
        let col = "#7f8c8d";
        if(jur.includes("제주")) col="#e74c3c"; else if(jur.includes("서귀포")) col="#3498db";
        else if(jur.includes("동부")) col="#2ecc71"; else if(jur.includes("서부")) col="#9b59b6";
        let b = parseFloat(baesu) || 0;
        let size = b >= 100 ? 50 : (b >= 30 ? 40 : 32);
        let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 35"><path fill="${col}" stroke="#fff" stroke-width="1.5" d="M12 0C5.373 0 0 5.373 0 12c0 8.438 11.233 22.38 11.536 22.753a.623.623 0 0 0 .928 0C12.767 34.38 24 20.438 24 12 24 5.373 18.627 0 12 0zm0 17.5a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/></svg>`;
        return new kakao.maps.MarkerImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg), new kakao.maps.Size(size, size));
    }

    mapData.forEach(row => {
        if(!row.lat) return;
        let jur = row['관할서/센터'] || row['관할/센터'] || '';
        let marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(row.lat, row.lng), image: getMarkerImg(jur, row['배수']) });
        
        let details = row['세부내역'] || [];
        // 테이블 내용이 하나도 생략되지 않도록 전체 출력
        let tableHtml = `<table class="info-table">
            <tr><th>품명</th><th>세부품질</th><th>최대용량</th></tr>`;
        if(details.length > 0) {
            details.forEach(d => {
                tableHtml += `<tr><td>${d['(*)품명'] || '-'}</td><td>${d['(*)세부품질명'] || '-'}</td><td>${d['(*)최대용량'] || '-'}</td></tr>`;
            });
        } else {
            tableHtml += `<tr><td colspan="3" style="text-align:center; color:#e74c3c;">세부 허가내역 없음</td></tr>`;
        }
        tableHtml += `</table>`;

        let content = `<div class="info-card">
            <div class="info-head"><div class="info-icon">🚒</div><div><h4 class="info-title">${row['대상명']}</h4><div class="info-meta">${row['제조소등구분'] || row['제조소등 구분'] || ''} · ${row['배수'] || 0}배수</div></div></div>
            <div class="info-address"><span>📍</span><span>${row['도로명'] || row['주소']}</span></div>
            <button id="private-btn-${row.NO}" class="private-contact-btn" onclick="showPrivateInfo(${JSON.stringify(row.NO)})">🔒 관리자 연락처 보기</button>
            <div id="private-info-${row.NO}" class="private-contact-info"></div>
            <button class="roadview-btn" onclick="openNearestRoadviewByNo(${row.NO})">🛣️ 주변에서 가장 가까운 로드뷰</button>
            <div class="detail-scroll"><div class="detail-label"><span>📊</span><span>위험물 세부 취급 현황</span></div>${tableHtml}</div>
        </div>`;

        let iw = new kakao.maps.InfoWindow({ content: content, removable: true });
        kakao.maps.event.addListener(marker, 'click', () => { openSingleInfo(iw, marker); });
        clusterer.addMarker(marker);
        markersData.push({ m: marker, name: row['대상명'], jur: jur, iw: iw });
    });

    function filterSearch() {
        let val = document.getElementById('searchInput').value.toLowerCase();
        let list = document.getElementById('searchResults');
        list.innerHTML = '';
        if(!val) return;
        markersData.filter(x => x.name.toLowerCase().includes(val)).forEach(x => {
            let li = document.createElement('li');
            li.innerHTML = `<b>${x.name}</b> <small>(${x.jur})</small>`;
            li.onclick = () => { map.panTo(x.m.getPosition()); map.setLevel(3); openSingleInfo(x.iw, x.m); };
            list.appendChild(li);
        });
    }
</script>
</body>
</html>
