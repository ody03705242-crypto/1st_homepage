<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- 📱 모바일 화면에 맞게 스케일을 자동 조정하는 태그 (필수) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>수난인명구조장비함 점검 시스템</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

        :root {
            --fire: #EA6A12;
            --fire-dark: #B84F0D;
            --amber: #FFB800;
            --alarm: #F4511E;
            --alarm-dark: #C73D12;
            --bg: #FBF8F4;
            --surface: #FFFFFF;
            --ink: #2B241E;
            --muted: #7C7268;
            --line: #ECE4D8;
        }

        body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); overflow: hidden; color: var(--ink); }
        
        /* 좌측 패널 (PC 기본 기준) */
        #sidebar { width: 400px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: 2px 0 16px rgba(32,20,16,0.08); z-index: 10; height: 100%; }
        
        .header { background: linear-gradient(135deg, var(--fire) 0%, var(--fire-dark) 100%); padding: 20px; color: white; border-bottom: 3px solid var(--alarm); }
        .header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }

        /* 관리번호 검색창 */
        .search-bar { display: flex; gap: 8px; padding: 12px 15px; background: #FFF8EE; border-bottom: 1px solid var(--line); }
        .search-bar input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 999px; font-family: inherit; font-size: 13px; box-sizing: border-box; background: var(--surface); }
        .search-bar input:focus { outline: 2px solid var(--fire); outline-offset: 1px; border-color: var(--fire); }
        .search-bar button { padding: 10px 16px; background: var(--fire); color: white; border: none; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .search-bar button:hover { background: var(--fire-dark); }

        /* 📱 모바일에서 폼/목록 전체화면 볼 때 나오는 '지도로 돌아가기' 버튼 (PC에서는 항상 숨김) */
        .back-to-map-btn { display: none; width: 100%; padding: 10px; background: var(--ink); color: white; border: none; font-size: 13px; font-weight: 700; cursor: pointer; }

        /* 📱 모바일 전용: 위/아래로 밀어서 지도⇄전체화면 전환하는 손잡이 */
        .drag-handle { display: none; }
        
        /* 통계 박스 */
        .stats { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-bottom: 1px solid var(--line); background: #F7F9FA; }
        .stat-box { background: var(--surface); border: 1px solid var(--line); padding: 12px; border-radius: 10px; text-align: center; font-size: 14px; color: var(--muted); cursor: pointer; transition: 0.2s; }
        .stat-box:hover { background: #FDF3D9; border-color: #F0CE7A; }
        .stat-box strong { display: block; font-size: 20px; color: var(--fire); margin-top: 4px; font-weight: 700; }
        .stat-total { grid-column: 1 / -1; background: var(--fire); border-color: var(--fire); cursor: default; padding: 10px; border-radius: 10px; }
        .stat-total:hover { background: var(--fire); border-color: var(--fire); }
        .stat-total { color: rgba(255,255,255,0.75); }
        .stat-total strong { color: #fff; font-size: 26px; }

        /* 메뉴 탭 스타일 */
        .tab-menu { display: flex; border-bottom: 1px solid var(--line); background: #F7F9FA; flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 12px 2px; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; }
        .tab-btn.active { color: var(--amber); border-bottom: 3px solid var(--amber); background: var(--surface); font-weight: 700; }

        /* 화면 뷰 영역 */
        .view-section { display: none; padding: 20px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
        .view-section.active { display: block; }

        /* 점검 폼 영역 */
        #default-msg { text-align: center; color: var(--muted); margin-top: 60px; font-size: 15px; line-height: 1.7; }
        #inspect-form { display: none; }
        
        .eq-info { background: var(--bg); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--line); }
        .eq-info .tag { display: inline-block; background: var(--amber); color: white; font-size: 12px; padding: 4px 10px; border-radius: 999px; margin-bottom: 8px; font-weight: 700; }
        .eq-info .id { font-size: 20px; font-weight: 700; color: var(--fire); margin-bottom: 5px; }
        .eq-info .loc { font-size: 14px; color: var(--muted); word-break: keep-all; }

        /* 최근 사진 보기 영역 */
        .recent-photos { display: none; background: var(--surface); border: 1px solid var(--line); padding: 10px; border-radius: 10px; margin-bottom: 15px; }
        .recent-photos label { display: block; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
        .photo-thumbs { display: flex; gap: 10px; }
        .photo-thumbs div { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
        .photo-thumbs img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; margin-bottom: 4px; transition: 0.2s; }
        .photo-thumbs img:hover { filter: brightness(0.9); }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
        .input-group select, .input-group textarea, .input-group input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 14px; box-sizing: border-box; color: var(--ink); }
        .input-group select:focus, .input-group textarea:focus, .input-group input:focus { outline: 2px solid var(--amber); outline-offset: 1px; border-color: var(--amber); }
        .input-group textarea { height: 80px; resize: none; }
        
        /* 세부 소요 수량 입력 박스 */
        #detail-needs-box { display: none; background: #FFF4EC; border: 1px solid #F3C4A4; padding: 12px; border-radius: 10px; margin-bottom: 16px; }
        .needs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .needs-item { display: flex; align-items: center; justify-content: space-between; background: var(--surface); padding: 6px 10px; border-radius: 6px; border: 1px solid #F3C4A4; }
        .needs-item span { font-size: 12px; font-weight: 700; color: var(--alarm-dark); }
        .needs-item input { width: 60px; padding: 4px 6px; text-align: center; font-weight: 700; font-size: 14px; border: 1px solid var(--line); border-radius: 6px;}

        /* 사진 입력 그룹 분리 */
        .photo-input-container { display: flex; gap: 10px; }
        .photo-input-container > div { flex: 1; background: #F7F9FA; padding: 10px; border-radius: 8px; border: 1px solid var(--line); }
        .photo-input-container label { font-size: 12px; font-weight:700; color: var(--ink); margin-bottom: 6px; display:block; }
        .photo-input-container input[type="file"] { padding: 5px; font-size: 11px; width: 100%; box-sizing: border-box; background: var(--surface); border-radius: 6px; border: 1px solid var(--line); }
        
        .preview-img { display: none; width: 100%; height: 100px; object-fit: cover; margin-top: 8px; border-radius: 6px; border: 1px solid var(--line); }

        .btn-save { width: 100%; padding: 15px; background: var(--alarm); color: white; border: none; border-radius: 999px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 14px rgba(244,81,30,0.32); transition: 0.15s; }
        .btn-save:hover { background: var(--alarm-dark); box-shadow: 0 4px 14px rgba(199,61,18,0.4); }
        .btn-save:disabled { background: #C7CDD3; box-shadow: none; cursor: default; }

        /* 리스트 영역 공통 */
        .history-item { background: var(--surface); border: 1px solid var(--line); padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(32,20,16,0.05); transition: 0.15s; }
        .history-item:hover { border-color: var(--amber); }
        .history-item .h-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bg); padding-bottom: 8px; margin-bottom: 10px; }
        .history-item .h-title { font-size: 16px; font-weight: 700; color: var(--fire); }
        .history-item .h-date { font-size: 12px; color: var(--muted); }
        .btn-delete { background: none; border: 1px solid var(--line); color: var(--muted); font-size: 12px; padding: 3px 7px; border-radius: 6px; cursor: pointer; line-height: 1; }
        .btn-delete:hover { background: #FDEBEA; border-color: #F3B9B4; color: #B4231A; }
        .history-item .h-info { font-size: 13px; color: var(--muted); margin-bottom: 4px; word-break: keep-all; }
        .history-item .h-status { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #FCF0D6; color: var(--amber); margin-top: 4px; }
        .history-item .h-memo { background: #F7F9FA; padding: 10px; border-radius: 8px; font-size: 13px; color: var(--ink); margin-top: 10px; border: 1px dashed var(--line); }

        /* 🟢🟡🔴🟠 실적 카드: 점검 상태별 색상 구분 */
        .history-item.status-ok { background: #F1FAF4; border-color: #BFE6CE; }
        .history-item.status-repair { background: #FFFAEE; border-color: #F0DDA0; }
        .history-item.status-loss { background: #FDEEEC; border-color: #F1BEB6; }
        .history-item.status-mixed { background: #FFF3E8; border-color: #F3CDA0; }

        .h-title.status-ok { color: #217A4C !important; }
        .h-title.status-repair { color: #B8860B !important; }
        .h-title.status-loss { color: #C0392B !important; }
        .h-title.status-mixed { color: #C56A17 !important; }

        .h-status.status-ok { background: #DDF3E4; color: #217A4C; }
        .h-status.status-repair { background: #FBEBC3; color: #916307; }
        .h-status.status-loss { background: #F8D6D1; color: #A5301F; }
        .h-status.status-mixed { background: #FBE0C3; color: #A5540E; }
        
        .history-photos { display: flex; gap: 10px; margin-top: 10px; }
        .history-photos > div { flex: 1; text-align: center; font-size: 11px; color: var(--muted);}
        .history-photos img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }

        /* 보수/소요 배지 스타일 */
        .repair-badge-wrap { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
        .repair-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
        .badge-box { background: #FFEADC; color: #B44A16; border: 1px solid #F3C4A4; }
        .badge-ring { background: #FBE3E0; color: #B23B2E; border: 1px solid #F0BEB8; }
        .badge-vest { background: #FDF0D5; color: #9C6A15; border: 1px solid #F0DBA8; }
        .badge-rope { background: #E1EEF0; color: #2E6B78; border: 1px solid #BEDBE0; }

        .empty-history { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }

        /* 📈 월별 통계 */
        .stat-month-block { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
        .stat-month-block summary { padding: 12px 15px; font-weight: 700; color: var(--fire-dark); cursor: pointer; display: flex; justify-content: space-between; align-items: center; list-style: none; }
        .stat-month-block summary::-webkit-details-marker { display: none; }
        .stat-month-total { font-size: 12px; font-weight: 700; color: var(--muted); }
        .stat-month-body { padding: 4px 15px 12px; border-top: 1px solid var(--line); }
        .stat-month-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; border-bottom: 1px dashed var(--line); }
        .stat-month-row:last-child { border-bottom: none; }
        .stat-month-station { color: var(--ink); font-weight: 600; }
        .stat-month-value { color: var(--muted); font-weight: 700; }

        /* 우측 지도 */
        #map { flex: 1; height: 100%; position: relative; }
        .info-title { padding: 5px 10px; font-size: 13px; font-weight: 700; color: var(--fire); white-space: nowrap; }

        .marker-label {
            background: rgba(255, 255, 255, 0.95); border: 1px solid var(--fire); color: var(--fire);
            padding: 3px 7px; font-size: 12px; font-weight: 700; border-radius: 6px;
            box-shadow: 0 2px 4px rgba(184,79,13,0.2); white-space: nowrap; pointer-events: none;
        }

        /* 📸 이미지 확대 뷰어 (모달) */
        #image-viewer {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(26,20,16,0.92); z-index: 9999; flex-direction: column;
            align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        #image-viewer img { max-width: 90%; max-height: 80%; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        #image-viewer .close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 30px; font-weight: bold; cursor: pointer; }
        #image-viewer .viewer-label { color: white; font-size: 16px; margin-top: 15px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 999px; }

        /* 🧭 로드뷰 모달 (크게 보기) */
        .roadview-modal {
            display: none; position: fixed; inset: 0; z-index: 9998;
            background: rgba(24,18,14,0.6); backdrop-filter: blur(4px);
            align-items: center; justify-content: center; padding: 20px;
        }
        .roadview-modal.active { display: flex; }
        .roadview-modal-card {
            background: var(--surface); border-radius: 14px; overflow: hidden;
            width: 100%; max-width: 760px; box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }
        .roadview-modal-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .roadview-modal-title { font-size: 16px; font-weight: 700; color: var(--ink); }
        .roadview-modal-subtitle { font-size: 12px; color: var(--muted); margin-top: 4px; }
        .roadview-modal-close { background: none; border: none; font-size: 24px; line-height: 1; color: var(--muted); cursor: pointer; padding: 2px 6px; }
        .roadview-modal-close:hover { color: var(--ink); }
        #map-roadview-box { width: 100%; height: 62vh; max-height: 520px; min-height: 260px; background: #ddd; }

        @media screen and (max-width: 768px) {
            .roadview-modal { padding: 0; }
            .roadview-modal-card { max-width: 100%; height: 100%; border-radius: 0; display: flex; flex-direction: column; }
            #map-roadview-box { flex: 1; height: auto; max-height: none; }
        }

        /* 📱 모바일 최적화 (스마트폰 크기일 때 위아래 배치) */
        @media screen and (max-width: 768px) {
            body { flex-direction: column; } 
            
            /* 지도를 화면 위쪽(45%)에 고정 */
            #map { flex: none; height: 45vh; width: 100%; order: -1; } 
            
            /* 좌측 패널을 화면 아래쪽(55%)으로 이동 */
            #sidebar { width: 100%; height: 55vh; border-right: none; border-top: 2px solid var(--line); box-shadow: 0 -4px 16px rgba(32,20,16,0.12); } 
            
            .drag-handle { display: flex; justify-content: center; align-items: center; padding: 9px 0; background: var(--surface); cursor: grab; touch-action: none; }
            .drag-handle span { width: 44px; height: 5px; border-radius: 999px; background: var(--line); }
            
            .header { padding: 12px 15px; }
            .header h1 { font-size: 18px; }
            
            .stats { padding: 10px; grid-template-columns: 1fr 1fr; gap: 6px; }
            .stat-box { padding: 8px; font-size: 12px; }
            .stat-box strong { font-size: 16px; margin-top: 2px; }
            .stat-total strong { font-size: 20px; }
            
            .tab-btn { font-size: 11px; padding: 10px 1px; letter-spacing: -0.5px; }
            
            .view-section { padding: 15px; padding-bottom: 40px; }
            .needs-grid { grid-template-columns: 1fr; } /* 입력창 1열 배치 */

            /* 🔽 마커를 누르거나 목록 탭을 볼 때: 지도를 숨기고 사이드바를 전체화면으로 */
            body.mobile-form-open #map { display: none; }
            body.mobile-form-open #sidebar { height: 100vh; }
            body.mobile-form-open .back-to-map-btn { display: block; }

            /* 🔽 저장 버튼이 스크롤 안 해도 항상 보이도록 화면 하단에 고정 */
            body.mobile-form-open .view-section.active { padding-bottom: 260px; }
            body.mobile-form-open #view-form.active { padding-bottom: 220px; }
            body.mobile-form-open #view-form .btn-save {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                margin: 0;
                border-radius: 0;
                z-index: 50;
                box-shadow: 0 -4px 14px rgba(0,0,0,0.2);
            }
        }
    </style>
    <!-- 실제 카카오 API 키를 아래 appkey 부분에 입력하세요 -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7351cd9c9ec69e0dd7d99c82f08764c0&libraries=clusterer&autoload=false"></script>
</head>
<body>

    <!-- 사이드바 (모바일에서는 화면 하단으로 내려감) -->
    <div id="sidebar">
        <div class="drag-handle" id="drag-handle"><span></span></div>

        <div class="header">
            <h1>🚒 수난인명구조장비함 관리</h1>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="🔍 관리번호로 검색 (예: 한림-01)" onkeydown="if(event.key==='Enter'){ searchEquipment(); }">
            <button type="button" onclick="searchEquipment()">이동</button>
        </div>
        
        <button type="button" class="back-to-map-btn" onclick="closeMobileForm()">⬅ 지도로 돌아가기</button>

        <div class="stats">
            <div class="stat-box stat-total">총 합계 <strong>394</strong></div>
            <div class="stat-box" onclick="showStationList('제주')">제주 <strong id="stat-jeju">108</strong></div>
            <div class="stat-box" onclick="showStationList('서귀포')">서귀포 <strong id="stat-seogwipo">46</strong></div>
            <div class="stat-box" onclick="showStationList('서부')">서부 <strong id="stat-seobu">119</strong></div>
            <div class="stat-box" onclick="showStationList('동부')">동부 <strong id="stat-dongbu">121</strong></div>
        </div>

        <div class="tab-menu">
            <div class="tab-btn active" data-tab="form" onclick="switchTab('form')">📝 폼</div>
            <div class="tab-btn" data-tab="history" onclick="switchTab('history')">📋 실적</div>
            <div class="tab-btn" data-tab="repairs" onclick="switchTab('repairs')">🛠️ 보수</div>
            <div class="tab-btn" data-tab="needs" onclick="switchTab('needs')">🚨 요점검</div>
            <div class="tab-btn" data-tab="status" onclick="switchTab('status')">📊 상태</div>
            <div class="tab-btn" data-tab="stats" onclick="switchTab('stats')">📈 통계</div>
        </div>

        <!-- 뷰 1: 점검 폼 -->
        <div id="view-form" class="view-section active">
            <div id="default-msg">
                <div style="font-size: 46px; margin-bottom: 12px;">👨‍🚒</div>
                📍 지도에서 장비함 마커를 클릭하면<br>점검결과를 입력할 수 있습니다.
            </div>

            <div id="inspect-form">
                <div class="eq-info">
                    <span class="tag" id="label-station">소방서</span>
                    <div class="id" id="label-id">관리번호</div>
                    <div class="loc" id="label-loc">상세위치</div>
                </div>

                <!-- 최근 사진 보기 영역 -->
                <div class="recent-photos" id="recent-photos-container">
                    <label>📸 최근 저장된 사진 (클릭 시 확대)</label>
                    <div class="photo-thumbs">
                        <div id="thumb-ext-wrap" style="display:none;">
                            <img id="thumb-ext" onclick="openImageViewer(this.src, '최근 외부 사진')">
                            <span>외부 사진</span>
                        </div>
                        <div id="thumb-int-wrap" style="display:none;">
                            <img id="thumb-int" onclick="openImageViewer(this.src, '최근 내부 사진')">
                            <span>내부 사진</span>
                        </div>
                    </div>
                </div>

                <!-- 이설 좌표 직접 입력 영역 -->

        // 📉 사진을 서버에 올리기 전에 가로/세로 최대 1600px, 화질 75%로 압축해서
        // 저장공간과 조회 트래픽(Cloudinary 크레딧)을 크게 아낍니다.
        function compressImage(file, maxDim, quality) {
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        var w = img.width, h = img.height;
                        if (w > h) {
                            if (w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
                        } else {
                            if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
                        }
                        var canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        canvas.toBlob(function(blob) {
                            if (blob) resolve(blob); else reject(new Error('이미지 압축 실패'));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = function() { reject(new Error('이미지를 불러올 수 없습니다.')); };
                    img.src = e.target.result;
                };
                reader.onerror = function() { reject(new Error('파일을 읽을 수 없습니다.')); };
                reader.readAsDataURL(file);
            });
        }

        async function uploadToCloudinary(file, publicId) {
            var compressed = await compressImage(file, 1600, 0.75);
            var formData = new FormData();
            formData.append('file', compressed, 'photo.jpg');
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            if (publicId) formData.append('public_id', publicId);
            var res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/image/upload', {
                method: 'POST',
                body: formData
            });
            if (!res.ok) throw new Error('사진 업로드 실패');
            var data = await res.json();
            // 캐시 문제 없이 항상 최신 사진이 보이도록 버전 번호를 붙여서 반환
            return data.secure_url + '?v=' + data.version;

        function toggleNeedsBox() {
            var status = document.getElementById('input-status').value;
            var box = document.getElementById('detail-needs-box');
            if (status !== '정상') {
                box.style.display = 'block';
                if(status === '수리필요' && parseInt(document.getElementById('need-box').value) === 0) {
                    document.getElementById('need-box').value = 1;
                }
            } else {
                box.style.display = 'none';
                document.getElementById('need-box').value = 0;
                document.getElementById('need-ring').value = 0;
                document.getElementById('need-vest').value = 0;
                document.getElementById('need-rope').value = 0;
            }

        function isInspectedCurrentPeriod(eqId) {
            var now = new Date(); 
            var currentMonth = now.getMonth() + 1;
            var currentYear = now.getFullYear();
            var records = historyData.filter(h => h.id === eqId);
            
            for (var i = 0; i < records.length; i++) {
                var d = new Date(records[i].date);
                if (d.getFullYear() !== currentYear) continue; 
                var m = d.getMonth() + 1;

                if (currentMonth >= 1 && currentMonth <= 3) { if (m >= 1 && m <= 3) return true; } 
                else if (currentMonth >= 10 && currentMonth <= 12) { if (m >= 10 && m <= 12) return true; } 
                else { if (m === currentMonth) return true; }
            }
            return false;
        }

        function getCurrentPeriodLabel() {
            var now = new Date();
            var m = now.getMonth() + 1;
            if (m >= 1 && m <= 3) return "1분기 (1~3월)";
            if (m >= 10 && m <= 12) return "4분기 (10~12월)";
            return m + "월";
        }

            return window.matchMedia('(max-width: 768px)').matches;

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));

            var targetBtn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
            if(targetBtn) targetBtn.classList.add('active');
            
            var targetView = document.getElementById(`view-${tabName}`);

            if(tabName === 'history') renderHistory();

        async function deleteRecord(docId) {
            var pw = prompt('🔒 이 점검 기록을 삭제하려면 비밀번호를 입력하세요.');
            if (pw === null) return; // 취소함
            if (pw !== '0000') { alert('❌ 비밀번호가 올바르지 않습니다.'); return; }
            if (!confirm('정말 삭제하시겠습니까?\n삭제한 기록은 되돌릴 수 없습니다.')) return;

            try {
                await deleteInspectionFromFirestore(docId);
                historyData = historyData.filter(function(r) { return r.docId !== docId; });
                refreshMarkerColors();
                renderHistory();
            } catch (err) {
                console.error(err);
                alert('❌ 삭제 중 오류가 발생했습니다. 인터넷 연결을 확인해주세요.\n\n(' + err.message + ')');
            }
        }

        function getStatusClass(statusText) {
            statusText = statusText || '';
            if (statusText.indexOf('정상') !== -1) return 'status-ok';
            var hasRepair = statusText.indexOf('수리') !== -1;
            var hasLoss = statusText.indexOf('망실') !== -1;
            if (hasRepair && hasLoss) return 'status-mixed';
            if (hasLoss) return 'status-loss';
            return 'status-repair';
        }

        function renderStatus() {
            var container = document.getElementById('status-container');
            var periodLabel = getCurrentPeriodLabel();
            var total = equipmentList.length;
            var inspected = equipmentList.filter(eq => isInspectedCurrentPeriod(eq.id)).length;
            var notInspected = total - inspected;
            var pct = total > 0 ? ((inspected / total) * 100).toFixed(1) : 0;

            var html = `
                <div style="background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px;">
                    <h3 style="margin-top:0; font-size:16px; color:#1e3a8a;">📊 ${periodLabel} 전체 점검률</h3>
                    <div style="background:#e2e8f0; border-radius:10px; height:20px; width:100%; overflow:hidden; margin: 10px 0;">
                        <div style="background:#2563eb; width:${pct}%; height:100%;"></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:14px; font-weight:bold;">
                        <span style="color:#2563eb">완료: ${inspected}건</span>
                        <span style="color:#b91c1c">미완료: ${notInspected}건</span>
                    </div>
                </div>
            `;
            
            var stations = ['제주', '서귀포', '서부', '동부'];
            stations.forEach(st => {
                var stList = equipmentList.filter(eq => eq.station === st);
                if (stList.length === 0) return;
                var stIns = stList.filter(eq => isInspectedCurrentPeriod(eq.id)).length;
                var stPct = ((stIns / stList.length) * 100).toFixed(0);

                html += `
                    <div class="history-item" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="showStationList('${st}')">
                        <div>
                            <div class="h-title">${st}소방서</div>
                            <div class="h-info">총 ${stList.length}개</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:14px; font-weight:bold; color:#2563eb;">${stIns} / ${stList.length}</div>
                            <div style="font-size:12px; color:#64748b;">${stPct}% 완료</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 📈 월별 통계: 소방서별로 몇 개소를, 몇 회 점검했는지 월 단위로 집계
        function renderMonthlyStats() {
            var container = document.getElementById('stats-container');

            if (historyData.length === 0) {
                container.innerHTML = '<div class="empty-history">아직 점검 기록이 없습니다.</div>';
                return;
            }

            var stations = ['제주', '서귀포', '서부', '동부'];
            var monthGroups = {}; // { 'YYYY-MM': { 제주: {count, ids:{}}, ... } }

            historyData.forEach(function(rec) {
                if (!rec.date) return;
                var ym = rec.date.substring(0, 7); // 'YYYY-MM'
                if (!monthGroups[ym]) {
                    monthGroups[ym] = {};
                    stations.forEach(function(st) { monthGroups[ym][st] = { count: 0, ids: {} }; });
                }
                var eq = equipmentList.find(function(e) { return e.id === rec.id; });
                var st = eq ? eq.station : null;
                if (st && monthGroups[ym][st]) {
                    monthGroups[ym][st].count += 1;
                    monthGroups[ym][st].ids[rec.id] = true;
                }
            });

            var months = Object.keys(monthGroups).sort().reverse(); // 최신 달 먼저

            var html = '';
            months.forEach(function(ym, idx) {
                var parts = ym.split('-');
                var yearPart = parts[0];
                var monthPart = parseInt(parts[1], 10);
                var totalCount = 0, totalEquip = 0;

                var rowsHtml = '';
                stations.forEach(function(st) {
                    var data = monthGroups[ym][st];
                    var equipCount = Object.keys(data.ids).length;
                    totalCount += data.count;
                    totalEquip += equipCount;
                    rowsHtml += '<div class="stat-month-row">' +
                        '<span class="stat-month-station">' + st + '소방서</span>' +
                        '<span class="stat-month-value">' + equipCount + '개소 · ' + data.count + '회</span>' +
                        '</div>';
                });

                html += '<details class="stat-month-block"' + (idx === 0 ? ' open' : '') + '>' +
                    '<summary>' + yearPart + '년 ' + monthPart + '월' +
                    '<span class="stat-month-total">' + totalEquip + '개소 · ' + totalCount + '회</span></summary>' +
                    '<div class="stat-month-body">' + rowsHtml + '</div>' +
                    '</details>';
            });

            container.innerHTML = html;
        }

        function showStationList(stationName) {
            switchTab('list');
            var container = document.getElementById('list-container');
            var filtered = equipmentList.filter(eq => eq.station === stationName);
            
            var html = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
                    <h3 style="margin:0; font-size:16px; color:#1e3a8a;">🏢 ${stationName}소방서 목록 (${filtered.length}개)</h3>
                    <button onclick="switchTab('status')" style="background:#f1f5f9; border:1px solid #cbd5e1; padding:5px 10px; border-radius:4px; cursor:pointer;">🔙 뒤로</button>
                </div>
            `;
            
            filtered.forEach(eq => {
                var isDone = isInspectedCurrentPeriod(eq.id);
                var statusBadge = isDone 
                    ? '<span style="background:#dcfce7; color:#166534; padding:2px 6px; border-radius:4px; font-size:11px;">🟢 완료</span>' 
                    : '<span style="background:#fee2e2; color:#991b1b; padding:2px 6px; border-radius:4px; font-size:11px;">🔴 미점검</span>';
                    
                html += `
                    <div class="history-item" style="cursor:pointer;" onclick="moveToMap(${eq.lat}, ${eq.lng}, '${eq.id}')">
                        <div class="h-title" style="display:flex; justify-content:space-between;">
                            ${eq.id} ${statusBadge}
                        </div>
                        <div class="h-info">📍 ${eq.location}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function searchEquipment() {
            var input = document.getElementById('search-input');
            var keyword = input.value.trim();
            if (!keyword) return;

            var normalize = function(s) { return s.replace(/\s/g, '').toLowerCase(); };
            var target = normalize(keyword);

            var eq = equipmentList.find(e => normalize(e.id) === target);
            if (!eq) eq = equipmentList.find(e => normalize(e.id).includes(target));
            if (!eq) eq = equipmentList.find(e => e.location.includes(keyword));

            if (eq) {
                moveToMap(eq.lat, eq.lng, eq.id);
                input.value = '';
                input.blur();
            } else {
                alert('🔍 "' + keyword + '" 에 해당하는 장비함을 찾을 수 없습니다.\n\n예) 한림-01 처럼 정확한 관리번호를 입력해보세요.');
            }
        }

        function moveToMap(lat, lng, id) {
            var pos = new kakao.maps.LatLng(lat, lng);
            
            // 🟢 지도가 회색 빈 화면으로 깨지는 현상을 방지하기 위해 setLevel 후 즉시 setCenter 실행 (panTo 애니메이션 제외)
            map.setLevel(3);
            map.setCenter(pos);
            setTimeout(function() { map.relayout(); map.setCenter(pos); }, 10);

            var eq = equipmentList.find(e => e.id === id);
            if(eq) {
                switchTab('form');
                document.getElementById('default-msg').style.display = 'none';
                document.getElementById('inspect-form').style.display = 'block';
                
                document.getElementById('label-station').innerText = eq.station + '소방서';
                document.getElementById('label-id').innerText = eq.id;
                document.getElementById('label-loc').innerText = eq.location;
                
                document.getElementById('input-lat').value = eq.lat;
                document.getElementById('input-lng').value = eq.lng;

                document.getElementById('input-date').valueAsDate = new Date();
                document.getElementById('input-status').value = '정상';
                toggleNeedsBox();
                document.getElementById('input-memo').value = '';
                
                document.getElementById('input-photo-ext').value = '';
                document.getElementById('input-photo-int').value = '';
                document.getElementById('preview-ext').style.display = 'none';
                document.getElementById('preview-int').style.display = 'none';
                document.getElementById('preview-ext').src = '';
                document.getElementById('preview-int').src = '';

                loadRecentPhotos(id);
                openMobileForm();
            }
        }

        function loadRecentPhotos(id) {
            var records = historyData.filter(r => r.id === id);
            var recentExt = records.find(r => r.photoExt);
            var recentInt = records.find(r => r.photoInt);

            var container = document.getElementById('recent-photos-container');
            var wrapExt = document.getElementById('thumb-ext-wrap');
            var wrapInt = document.getElementById('thumb-int-wrap');
            var imgExt = document.getElementById('thumb-ext');
            var imgInt = document.getElementById('thumb-int');

            if(recentExt || recentInt) {
                container.style.display = 'block';
                if(recentExt) { imgExt.src = recentExt.photoExt; wrapExt.style.display = 'block'; } else { wrapExt.style.display = 'none'; }
                if(recentInt) { imgInt.src = recentInt.photoInt; wrapInt.style.display = 'block'; } else { wrapInt.style.display = 'none'; }
            } else {
                container.style.display = 'none';
            }
        }

        function getLocationFromCenter() {
            var center = map.getCenter();
            document.getElementById('input-lat').value = center.getLat().toFixed(6);
            document.getElementById('input-lng').value = center.getLng().toFixed(6);
        }

        function previewPhoto(event, previewId) {
            var reader = new FileReader();
            var imgPreview = document.getElementById(previewId);
            reader.onload = function(){
                imgPreview.src = reader.result;
                imgPreview.style.display = 'block';
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            } else {
                imgPreview.style.display = 'none';
                imgPreview.src = '';
            }
        }

        function openImageViewer(src, label) {
            document.getElementById('viewer-img').src = src;
            document.getElementById('viewer-label').innerText = label;
            document.getElementById('image-viewer').style.display = 'flex';
        }
        function closeImageViewer() {
            document.getElementById('image-viewer').style.display = 'none';
        }

        kakao.maps.load(function() {
            updateTopStats();
            var container = document.getElementById('map');
            var options = { center: new kakao.maps.LatLng(33.37, 126.55), level: 10 };
            map = new kakao.maps.Map(container, options);

            // 🔴🟡🟢 상태별 마커 색상(핀) 이미지 만들기
            function makePinImage(hex) {
                var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="38" viewBox="0 0 30 38">' +
                    '<path d="M15 0C6.7 0 0 6.7 0 15c0 11 15 23 15 23s15-12 15-23C30 6.7 23.3 0 15 0z" fill="' + hex + '" stroke="#ffffff" stroke-width="1.5"/>' +
                    '<circle cx="15" cy="15" r="6" fill="#ffffff"/></svg>';
                var url = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
                return new kakao.maps.MarkerImage(url, new kakao.maps.Size(30, 38), { offset: new kakao.maps.Point(15, 38) });
            }
            markerImgOk = makePinImage('#2E8B57');      // 초록: 정상 점검 완료
            markerImgNone = makePinImage('#D0261B');    // 빨강: 미점검
            markerImgRepair = makePinImage('#F2B705');  // 노랑: 교체/수리 필요

            var clusterer = new kakao.maps.MarkerClusterer({ map: map, averageCenter: true, minLevel: 8 });
            var markers = [];
            var overlays = []; 
            infowindow = new kakao.maps.InfoWindow({zIndex:1});

            equipmentList.forEach(function(eq) {
                var pos = new kakao.maps.LatLng(eq.lat, eq.lng);
                var marker = new kakao.maps.Marker({ position: pos, image: markerImgNone });
                var labelOverlay = new kakao.maps.CustomOverlay({
                    position: pos, content: '<div class="marker-label">' + eq.id + '</div>', yAnchor: -0.4
                });
                
                markerMap[eq.id] = marker;
                overlayMap[eq.id] = labelOverlay;
                overlays.push(labelOverlay); 

                kakao.maps.event.addListener(marker, 'click', function() {
                    var records = historyData.filter(function(h) { return h.id === eq.id; });
                    var dateLabel = records.length > 0 ? records[0].date : '미점검';

                    infowindow.setContent(
                        '<div style="padding:8px; min-width:170px;">' +
                            '<div style="font-weight:700; font-size:13px; margin-bottom:4px;">' + eq.id + '</div>' +
                            '<div style="font-size:11px; color:#666; margin-bottom:6px;">최근 점검일: ' + dateLabel + '</div>' +
                            '<button onclick="mapRoadviewOpen(\'' + eq.id + '\', ' + eq.lat + ', ' + eq.lng + ')" ' +
                                'style="width:100%; padding:6px; border:none; border-radius:6px; background:#EA6A12; color:#fff; font-weight:700; font-size:12px; cursor:pointer;">🧭 로드뷰 보기</button>' +
                        '</div>'
                    );
                    infowindow.open(map, marker);
                    moveToMap(eq.lat, eq.lng, eq.id);
                });
                markers.push(marker);
            });

            clusterer.addMarkers(markers);
            refreshMarkerColors();

            function updateLabelVisibility() {
                var level = map.getLevel();
                if (level <= 6) { overlays.forEach(function(o) { o.setMap(map); }); } 
                else { overlays.forEach(function(o) { o.setMap(null); }); }
            }
            updateLabelVisibility();
            kakao.maps.event.addListener(map, 'zoom_changed', updateLabelVisibility);
        });

        // 📏 두 좌표 사이의 거리(m)를 계산 (하버사인 공식)
        function distanceMeters(lat1, lng1, lat2, lng2) {
            var R = 6371000;
            var toRad = function(deg) { return deg * Math.PI / 180; };
            var dLat = toRad(lat2 - lat1);
            var dLng = toRad(lng2 - lng1);
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // 🧭 큰 모달창으로 로드뷰 보여주기 (없으면 가까운 주변 로드뷰로 대체)
        function mapRoadviewOpen(id, lat, lng) {
            var modal = document.getElementById('roadview-modal');
            var box = document.getElementById('map-roadview-box');
            var titleEl = document.getElementById('roadview-modal-title');
            var subEl = document.getElementById('roadview-modal-subtitle');

            titleEl.innerText = id + ' 주변 로드뷰';
            subEl.innerText = '가장 가까운 촬영 지점을 찾는 중...';
            box.innerHTML = '';
            modal.classList.add('active');

            var position = new kakao.maps.LatLng(lat, lng);
            if (!mapRoadviewClient) mapRoadviewClient = new kakao.maps.RoadviewClient();

            mapRoadviewClient.getNearestPanoId(position, 300, function(panoId) {
                if (panoId === null) {
                    subEl.innerText = '이 주변 300m 이내에는 로드뷰 정보가 없습니다.';
                    box.innerHTML = '<div style="display:flex; align-items:center; justify-content:center; height:100%; color:#888; font-size:13px;">로드뷰 정보가 없습니다.</div>';
                    return;
                }

                mapRoadviewInstance = new kakao.maps.Roadview(box);
                mapRoadviewInstance.setPanoId(panoId, position);

                kakao.maps.event.addListener(mapRoadviewInstance, 'position_changed', function() {
                    var actual = mapRoadviewInstance.getPosition();
                    var dist = Math.round(distanceMeters(lat, lng, actual.getLat(), actual.getLng()));
                    if (dist <= 15) {
                        subEl.innerText = '시설 바로 앞 촬영 지점입니다.';
                    } else {
                        subEl.innerText = '시설에서 약 ' + dist + 'm 떨어진 가장 가까운 촬영 지점입니다.';
                    }
                });

                setTimeout(function() { mapRoadviewInstance.relayout(); }, 60);
            });
        }

        function closeMapRoadview() {
            document.getElementById('roadview-modal').classList.remove('active');
            document.getElementById('map-roadview-box').innerHTML = '';
        }

        window.mapRoadviewOpen = mapRoadviewOpen;
        window.closeMapRoadview = closeMapRoadview;

        async function saveData() {
            var id = document.getElementById('label-id').innerText;
            var loc = document.getElementById('label-loc').innerText;
            var date = document.getElementById('input-date').value;
            var author = document.getElementById('input-author').value;
            var status = document.getElementById('input-status');
            var statusText = status.options[status.selectedIndex].text;
            var memo = document.getElementById('input-memo').value;
            
            var needBox = parseInt(document.getElementById('need-box').value) || 0;
            var needRing = parseInt(document.getElementById('need-ring').value) || 0;
            var needVest = parseInt(document.getElementById('need-vest').value) || 0;
            var needRope = parseInt(document.getElementById('need-rope').value) || 0;

            var extImg = document.getElementById('preview-ext');
            var intImg = document.getElementById('preview-int');
            var extFile = document.getElementById('input-photo-ext').files[0];
            var intFile = document.getElementById('input-photo-int').files[0];
            
            var newLat = parseFloat(document.getElementById('input-lat').value);
            var newLng = parseFloat(document.getElementById('input-lng').value);

            if (!date) { alert('점검 일자를 입력해주세요.'); return; }
            if (!author.trim()) { alert('작성자(점검자)를 입력해주세요.'); document.getElementById('input-author').focus(); return; }

            var saveBtn = document.querySelector('.btn-save');
            var originalBtnText = saveBtn.innerText;
            saveBtn.disabled = true;

            try {
                saveBtn.innerText = '⏳ 사진 압축 및 업로드 중...';
                // 장비함마다 외부/내부 사진 자리를 하나씩만 두고 새 사진으로 교체합니다.
                var photoExtSrc = extFile ? await uploadToCloudinary(extFile, 'jeju_soban/' + id + '_ext') : null;
                var photoIntSrc = intFile ? await uploadToCloudinary(intFile, 'jeju_soban/' + id + '_int') : null;

                var eqIndex = equipmentList.findIndex(e => e.id === id);
                var isLocationChanged = false;

                if(eqIndex !== -1) {
                    if(equipmentList[eqIndex].lat !== newLat || equipmentList[eqIndex].lng !== newLng) {
                        equipmentList[eqIndex].lat = newLat;
                        equipmentList[eqIndex].lng = newLng;
                        isLocationChanged = true;
                        
                        var newPos = new kakao.maps.LatLng(newLat, newLng);
                        if (markerMap[id]) markerMap[id].setPosition(newPos);
                        if (overlayMap[id]) overlayMap[id].setPosition(newPos);
                        
                        memo = "[📍이설되어 좌표수정됨] " + memo;
                    }
                }

                var newRecord = {
                    id: id,
                    location: loc,
                    date: date,
                    author: author,
                    status: statusText,
                    memo: memo,
                    needBox: needBox,
                    needRing: needRing,
                    needVest: needVest,
                    needRope: needRope,
                    photoExt: photoExtSrc,
                    photoInt: photoIntSrc 
                };

                saveBtn.innerText = '⏳ 서버에 저장 중...';
                var newDocId = await saveInspectionToFirestore(newRecord);
                newRecord.docId = newDocId;

                historyData.unshift(newRecord);
                refreshMarkerColors();

                var alertMsg = '✅ [' + id + '] 점검결과 저장 완료!\n\n작성자 : ' + author + '\n상태 : ' + statusText;
                if(needBox > 0 || needRing > 0 || needVest > 0 || needRope > 0) {
                    alertMsg += '\n\n🛠️ 소요 등록 내역:';
                    if(needBox > 0) alertMsg += '\n• 함체 수리: ' + needBox + '건';
                    if(needRing > 0) alertMsg += '\n• 구명환: ' + needRing + '개';
                    if(needVest > 0) alertMsg += '\n• 구명조끼: ' + needVest + '벌';
                    if(needRope > 0) alertMsg += '\n• 유도로프: ' + needRope + '개';
                }
                if(isLocationChanged) { alertMsg += '\n\n⚠️ 위치(좌표)가 성공적으로 변경되었습니다.'; }
                alert(alertMsg);
                
                document.getElementById('input-status').value = '정상';
                toggleNeedsBox();
                document.getElementById('input-memo').value = '';
                document.getElementById('input-photo-ext').value = '';
                document.getElementById('input-photo-int').value = '';
                extImg.style.display = 'none'; extImg.src = '';
                intImg.style.display = 'none'; intImg.src = '';

                switchTab('history');
            } catch (err) {
                console.error(err);
                alert('❌ 저장 중 오류가 발생했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.\n\n(' + err.message + ')');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = originalBtnText;
            }
        }

        // 📌 HTML의 onclick="..." 에서 호출할 수 있도록 전역(window)에 등록
        window.showStationList = showStationList;
        window.switchTab = switchTab;
        window.getLocationFromCenter = getLocationFromCenter;
        window.toggleNeedsBox = toggleNeedsBox;
        window.previewPhoto = previewPhoto;
        window.saveData = saveData;
        window.openImageViewer = openImageViewer;
        window.closeImageViewer = closeImageViewer;
        window.moveToMap = moveToMap;
        window.searchEquipment = searchEquipment;
        window.deleteRecord = deleteRecord;
        window.closeMobileForm = closeMobileForm;

        // 📱 드래그 핸들: 위로 밀면 전체화면(지도 숨김), 아래로 밀면 지도 화면으로
        (function() {
            var handle = document.getElementById('drag-handle');
            if (!handle) return;
            var startY = null;

            handle.addEventListener('touchstart', function(e) {
                startY = e.touches[0].clientY;
            }, { passive: true });

            handle.addEventListener('touchend', function(e) {
                if (startY === null) return;
                var endY = e.changedTouches[0].clientY;
                var diff = startY - endY; // 양수면 위로 밀었다는 뜻
                startY = null;

                if (diff > 30) {
                    openMobileForm();
                } else if (diff < -30) {
                    closeMobileForm();
                } else {
                    // 살짝 밀거나 그냥 탭한 경우: 현재 상태를 반대로 전환
                    if (document.body.classList.contains('mobile-form-open')) closeMobileForm();
                    else openMobileForm();
                }
            });
        })();
    </script>
